[project]
name = "mig"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zhifan Li", email = "z2367li@uwaterloo.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "commands",
    "ipykernel>=7.3.0",
    "utils",
]

[project.scripts]
mig = "mig.cli:main"

[tool.uv]
package = true

[tool.uv.workspace]
members = [
    "utils",
    "qa",
    "commands",
]

[tool.uv.sources]
utils = { workspace = true }
commands = { workspace = true }
